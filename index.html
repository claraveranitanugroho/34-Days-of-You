<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>34 Days of You 💛</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#f5f5f5;
  font-family:Arial;
}

/* ===== CONTAINER ===== */
.container {
  width: 100%;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* ===== CARD ===== */
.card {
  position: relative;
  width: 100%;
  height: 65vh;
  border-radius: 25px;
  overflow: hidden;
  background: black;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  margin-bottom: 20px;
  transition: transform 0.3s ease;
  touch-action: none;
}

/* stack effect */
.card:nth-child(2) {
  transform: scale(0.95) translateY(10px);
  opacity: 0.8;
}
.card:nth-child(3) {
  transform: scale(0.9) translateY(20px);
  opacity: 0.6;
}

.image {
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
}

.overlay {
  position:absolute;
  bottom:0;
  width:100%;
  padding:20px;
  color:white;
  background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
}

.name {
  font-size:24px;
  font-weight:bold;
}

.info {
  font-size:14px;
  margin-top:5px;
}

/* LIKE / NOPE */
.like, .nope {
  position: absolute;
  top: 20px;
  font-size: 28px;
  font-weight: bold;
  opacity: 0;
}

.like { left: 20px; color: #4CAF50; }
.nope { right: 20px; color: #ff4458; }

/* ===== BUTTON ===== */
.actions {
  display: flex;
  justify-content: center;
  gap: 30px;
}

.btn {
  width:70px;
  height:70px;
  border-radius:50%;
  border:none;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.no-btn { background:white; }
.yes-btn { background:#ff4458; color:white; }

/* ===== MATCH POPUP ===== */
.match {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:0.5s;
}

.match.show {
  opacity:1;
  pointer-events:auto;
}

.match h1 {
  font-size:40px;
  color:#ff4d6d;
  margin-bottom:20px;
}
</style>
</head>

<body>

<div class="container" id="container">

  <div class="card">
    <div class="image" style="background-image:url('clara3.jpg')"></div>
  </div>

  <div class="card">
    <div class="image" style="background-image:url('clara2.jpg')"></div>
  </div>

  <div class="card">
    <div class="image" style="background-image:url('clara.jpg')"></div>

    <div class="like">LIKE</div>
    <div class="nope">NOPE</div>

    <div class="overlay">
      <div class="name">Clara, 31</div>
      <div class="info">
        💼 IT (SAP Business Operation)<br>
        🎓 Universitas Atma Jaya
      </div>
    </div>
  </div>

</div>

<div class="actions">
  <button class="btn no-btn" onclick="swipeLeft()">❌</button>
  <button class="btn yes-btn" onclick="swipeRight()">❤️</button>
</div>

<div class="match" id="matchScreen">
  <h1>💛 It's a Match!</h1>
  <p>Aku pilih kamu, hari ini dan seterusnya 💖</p>
</div>

<script>
let container = document.getElementById("container");

let startX = 0;
let currentX = 0;
let isDragging = false;
let card = null;

function getTopCard() {
  return container.lastElementChild;
}

function handleStart(e) {
  card = getTopCard();
  if (!card) return;

  isDragging = true;
  startX = e.touches ? e.touches[0].clientX : e.clientX;
}

function handleMove(e) {
  if (!isDragging || !card) return;

  currentX = e.touches ? e.touches[0].clientX : e.clientX;
  let deltaX = currentX - startX;

  let rotate = deltaX / 10;

  card.style.transition = "none";
  card.style.transform = `translateX(${deltaX}px) rotate(${rotate}deg)`;

  let like = card.querySelector(".like");
  let nope = card.querySelector(".nope");

  if (like && nope) {
    if (deltaX > 0) {
      like.style.opacity = Math.min(deltaX / 100, 1);
      nope.style.opacity = 0;
    } else {
      nope.style.opacity = Math.min(-deltaX / 100, 1);
      like.style.opacity = 0;
    }
  }
}

function handleEnd() {
  if (!isDragging || !card) return;

  isDragging = false;

  let deltaX = currentX - startX;

  if (deltaX > 120) {
    swipeRight();
  } else if (deltaX < -120) {
    swipeLeft();
  } else {
    card.style.transition = "0.3s";
    card.style.transform = "translateX(0) rotate(0)";
  }
}

function swipeRight() {
  let card = getTopCard();
  if (!card) return;

  card.style.transition = "0.4s";
  card.style.transform = "translateX(500px) rotate(25deg)";

  setTimeout(() => {
    card.remove();

    if (container.children.length === 0) {
      showMatch();
    }
  }, 400);
}

function swipeLeft() {
  let card = getTopCard();
  if (!card) return;

  card.style.transition = "0.4s";
  card.style.transform = "translateX(-500px) rotate(-25deg)";

  setTimeout(() => {
    card.remove();

    if (container.children.length === 0) {
      showMatch();
    }
  }, 400);
}

function showMatch() {
  let match = document.getElementById("matchScreen");
  match.classList.add("show");

  setTimeout(() => {
    window.location.href = "main.html";
  }, 2500);
}

// event listener
document.addEventListener("touchstart", handleStart);
document.addEventListener("touchmove", handleMove);
document.addEventListener("touchend", handleEnd);

document.addEventListener("mousedown", handleStart);
document.addEventListener("mousemove", handleMove);
document.addEventListener("mouseup", handleEnd);
</script>

</body>
</html>
